[project]
name = "apple-contacts-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.27",
    "uvicorn>=0.20",
    "pydantic-settings>=2.0",
    "pyobjc-framework-Contacts>=10; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "known_issues: asserts behaviour the service does not have yet — expected to fail",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
apple-contacts-server = "apple_contacts_server.main:main"
